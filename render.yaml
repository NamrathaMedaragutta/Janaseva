# Render blueprint: one web service (FastAPI API + built React UI) and PostgreSQL.
# In Render: New -> Blueprint -> select this repository -> Apply. Nothing else to configure.
databases:
  - name: janaseva-db
    databaseName: janaseva
    user: janaseva
    plan: free

services:
  - type: web
    name: janaseva
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: janaseva-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "true"
      # Same-origin deployment: update if Render assigns a different service URL.
      - key: FRONTEND_URL
        value: https://janaseva.onrender.com
